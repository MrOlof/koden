<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;width:100%;height:100%}svg{display:block;width:100%;height:100%}
</style></head><body>
<svg viewBox="0 0 512 512" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e141b"/><stop offset="1" stop-color="#080b0f"/>
    </linearGradient>
    <linearGradient id="cy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33d9ec"/><stop offset="1" stop-color="#15c1da"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <!-- stem: bold bar, vertical sides, diagonally-cut top & bottom -->
  <polygon points="146,178 206,150 206,336 146,362" fill="url(#cy)"/>
  <!-- right side: one bold chevron (upper+lower arm joined at vertex), thin slit to stem -->
  <polyline points="356,152 244,256 356,360" fill="none" stroke="url(#cy)"
            stroke-width="52" stroke-linecap="butt" stroke-linejoin="miter"/>
</svg>
</body></html>
