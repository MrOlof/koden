name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit (advisory)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm check-types

      - name: Test
        run: pnpm test

      - name: React Compiler healthcheck (advisory)
        run: pnpm exec react-compiler-healthcheck
        continue-on-error: true

      - name: Build frontend
        run: pnpm build

      - name: Size budget
        run: pnpm size

      - name: Dead code (advisory)
        run: pnpm knip
        continue-on-error: true

  rust:
    runs-on: ubuntu-22.04
    # This job builds the whole dependency tree four times (check, clippy,
    # nextest, then clippy + nextest again under `semantic`). With incremental
    # artifacts and full debuginfo that filled the runner disk and killed the
    # worker mid-step with "No space left on device". Incremental buys nothing
    # on a throwaway runner, and line tables still give usable panic locations.
    # Local dev keeps `incremental = true` from Cargo.toml either way.
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v6

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-machete

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets --locked

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unused crates (advisory)
        working-directory: src-tauri
        run: cargo machete
        continue-on-error: true

      - name: cargo nextest
        working-directory: src-tauri
        run: cargo nextest run --locked

      # P5 (ADR-006): the `semantic` feature is DEFAULT-OFF and absent from the
      # shipped binary, but its gated code must keep compiling + passing so it does
      # not bit-rot before enablement. This job turns it ON; the default jobs above
      # prove it is OFF by default.
      - name: cargo clippy (semantic feature)
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked --features semantic -- -D warnings

      - name: cargo nextest (semantic feature)
        working-directory: src-tauri
        run: cargo nextest run --locked --features semantic

  rust-platforms:
    name: rust-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets --locked

      - name: cargo nextest
        working-directory: src-tauri
        run: cargo nextest run --locked --retries 2

  coverage:
    runs-on: ubuntu-22.04
    needs: rust
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: coverage

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Generate coverage
        working-directory: src-tauri
        run: cargo llvm-cov nextest --locked --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: lcov-report
          path: src-tauri/lcov.info
          if-no-files-found: error
