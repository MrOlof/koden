[package]
name = "koden"
version = "0.8.0"
description = "Koden — an open-source AI-native terminal emulator"
authors = ["Kosta Wadenfalk"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "koden_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Semantic search (P5, ADR-006) — DEFAULT-OFF, absent from the shipped binary.
# v1 ships only the Embedder/VectorStore seams + a dependency-free reference impl
# (gated here) that proves the seams compose and keeps the feature from rotting.
# The PRODUCTION swap lands behind this SAME flag at enablement time, deps pinned
# then: `semantic = ["dep:fastembed", "dep:hnsw_rs"]` (fastembed-rs Embedder via
# ONNX + hnsw_rs persisted VectorStore). No heavy deps enter the tree until then.
semantic = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
dirs = "6"
log = "0.4"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
globset = "0.4"
nucleo-matcher = "0.3"
shared_child = "1"
tauri-plugin-log = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
reqwest = { version = "0.12", default-features = false, features = [
	"rustls-tls",
	"stream",
] }
bytes = "1"
futures-util = "0.3"
tokio = { version = "1", default-features = false, features = ["rt"] }
tempfile = "3"
notify = "8.2.0"
# Pinned to 0.31 (ADR-006): newer libsqlite3-sys (>=0.38) build scripts use the
# unstable `cfg_select!` feature, which fails on the pinned rustc 1.94.1. 0.31's
# bundled SQLite ships FTS5 and predates that. Revisit on a rustc bump.
rusqlite = { version = "0.31", features = ["bundled"] }
blake3 = "1.8.5"
serde_yaml = "0.9"
tree-sitter = "0.26.9"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = [
	"apple-native",
] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSUserDefaults"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Windows MSVC CRT bindings (tzset / time / localtime_s / gmtime_s) for the
# machine-local UTC offset used by retry_detect's "resets <clock>" path. Same
# crate already used on unix; no new dependency, only a wider target.
libc = "0.2"
keyring = { version = "3.6", default-features = false, features = [
	"windows-native",
] }
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_System_JobObjects",
	"Win32_System_Threading",
	"Win32_System_Diagnostics_ToolHelp",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = true
